description: |
  If you want calls to be working you need to install voicecall plugin. Remember to reboot phone afterwards! Yottagram should pull it along but it's not required.

  If you want to have yottagram in share menu you need to install transferengine plugin.

  A telegram client that's superfast and super smooth. We want to make it as close to official app as possible. Forget the days of using telegram desktop or laggy crashy apps. Welcome to the future.

  Trello (development process): https://trello.com/b/nDmAfkoG/yottagram-development-issues

  Github: https://github.com/Michal-Szczepaniak/Yottagram

  Paypal: https://www.paypal.me/MisterMagister

  Patreon: https://www.patreon.com/Mister_Magister
