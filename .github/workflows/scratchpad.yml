name: Scratchpad

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.yaml"
      - "**/overlay/**"
      - "**/patches/**"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scratchpad-${{ github.event_name == 'workflow_dispatch' && inputs.pull_request || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: pr
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pull request number is required" >&2
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '"repo=\(.head.repo.full_name)\nsha=\(.head.sha)\nuser=\(.user.login)"' \
            >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - id: recipes
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          declare -A yaml_of=()

          under_extra() {
            case "/$1/" in
              */overlay/*|*/patches/*|*/.github/*) return 0 ;;
            esac
            return 1
          }

          recipe_id() {
            local file=$1
            local dir base
            dir=$(dirname "$file")
            base=$(basename "$file")
            if [[ "$base" == "build.yaml" ]]; then
              printf '%s\n' "$dir"
            else
              printf '%s/%s\n' "$dir" "${base%.yaml}"
            fi
          }

          add_file() {
            local file=$1
            [[ "$file" == *.yaml ]] || return 0
            if under_extra "$file"; then
              return 0
            fi
            yaml_of["$(recipe_id "$file")"]=$file
          }

          add_dir() {
            local dir=$1
            local file
            for file in "$dir"/*.yaml; do
              [[ -f "$file" ]] || continue
              add_file "$file"
            done
          }

          recipe_dir() {
            local dir=$1
            while true; do
              if ! under_extra "$dir" && compgen -G "$dir"/*.yaml > /dev/null; then
                printf '%s\n' "$dir"
                return 0
              fi
              if [[ "$dir" != */* ]]; then
                return 1
              fi
              dir=${dir%/*}
            done
          }

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename' > "$RUNNER_TEMP/pr-files.txt"
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            if [[ "$f" == *.yaml ]] && ! under_extra "$f"; then
              add_file "$f"
              continue
            fi
            dir=$(recipe_dir "$(dirname "$f")" || true)
            if [[ -n "$dir" ]]; then
              add_dir "$dir"
            fi
          done < "$RUNNER_TEMP/pr-files.txt"

          if [[ ${#yaml_of[@]} -eq 0 ]]; then
            echo "no recipe yaml, overlay, or patch changes"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : > "$RUNNER_TEMP/changed-recipes.txt"
          while IFS= read -r id; do
            printf '%s\t%s\n' "$id" "${yaml_of[$id]}" >> "$RUNNER_TEMP/changed-recipes.txt"
          done < <(printf '%s\n' "${!yaml_of[@]}" | sort)
          echo "count=${#yaml_of[@]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.recipes.outputs.count != '0'
        with:
          go-version: stable

      - name: Install sfosbuild and ftuna
        if: steps.recipes.outputs.count != '0'
        run: |
          go install github.com/mrcyjanek/sfosbuild@latest
          go install github.com/mrcyjanek/ftuna/cmd/ftuna@latest

      - uses: actions/cache@v4
        if: steps.recipes.outputs.count != '0'
        with:
          path: ~/.config/ftuna/scratch-token
          key: ftuna-scratch-token-${{ steps.pr.outputs.number }}

      - name: Register scratch account
        if: steps.recipes.outputs.count != '0'
        run: ftuna scratch register

      - name: Build and comment
        if: steps.recipes.outputs.count != '0'
        env:
          FTUNA_RECIPES: ${{ github.workspace }}
          PR_USER: ${{ steps.pr.outputs.user }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          sanitize() {
            printf '%s' "$1" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -e 's/[^a-z0-9_-]/-/g' -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//'
          }

          mapfile -t recipes < "$RUNNER_TEMP/changed-recipes.txt"
          user=$(sanitize "$PR_USER")
          if [[ -z "$user" ]]; then
            user=pr
          fi
          prefix="${user}-${PR_NUMBER}-"
          multi=0
          if [[ ${#recipes[@]} -gt 1 ]]; then
            multi=1
          fi

          lines=()
          fail=0
          i=0
          for line in "${recipes[@]}"; do
            recipe=${line%%$'\t'*}
            yaml=${line#*$'\t'}
            if [[ "$multi" -eq 1 ]]; then
              suffix=$i
            else
              suffix=$(sanitize "$(basename "$recipe")")
              if [[ -z "$suffix" ]]; then
                suffix=0
              fi
            fi
            max_suffix=$((80 - ${#prefix}))
            if [[ "$max_suffix" -lt 1 ]]; then
              echo "scratch name prefix is longer than 80 characters: $prefix" >&2
              exit 1
            fi
            suffix=${suffix:0:max_suffix}
            name="${prefix}${suffix}"

            python3 - "$yaml" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          lines = path.read_text().splitlines(keepends=True)
          out = [line for line in lines if not line.startswith("arches:")]
          if out and not out[-1].endswith("\n"):
              out[-1] += "\n"
          out.append("arches: aarch64\n")
          path.write_text("".join(out))
          PY

            echo "::group::ftuna 5.1.0.11 ${recipe} ${name}"
            set +e
            log=$(ftuna 5.1.0.11 "$recipe" "$name" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$log"
            echo "::endgroup::"

            if [[ "$status" -ne 0 ]]; then
              lines+=("${recipe} build failed")
              fail=1
            else
              url=$(printf '%s\n' "$log" | grep -oE 'https://scratchpad-repo\.ftuna\.eu/[0-9a-f]+/[^[:space:]]+' | tail -n 1 || true)
              if [[ -z "$url" ]]; then
                lines+=("${recipe} built but printed no scratch URL")
                fail=1
              else
                lines+=("${recipe} ${url}")
              fi
            fi
            i=$((i + 1))
          done

          {
            echo '<!-- ftuna-scratch -->'
            printf '%s\n' "${lines[@]}"
          } > "$RUNNER_TEMP/scratch-comment.md"

          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | contains("<!-- ftuna-scratch -->")) | .id' \
            > "$RUNNER_TEMP/comment-ids.txt"
          comment_id=$(head -n 1 "$RUNNER_TEMP/comment-ids.txt")
          jq -n --rawfile body "$RUNNER_TEMP/scratch-comment.md" '{body:$body}' > "$RUNNER_TEMP/scratch-comment.json"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/scratch-comment.json" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input "$RUNNER_TEMP/scratch-comment.json" > /dev/null
          fi

          exit "$fail"
